services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      # dev: code + storage (logs) directly on the host. In production remove the second line and enable ai_storage:
      # - ai_storage:/var/www/html/storage
      - ./:/var/www/html
    # so the container can reach a database running on the same server (host.docker.internal)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # if the database is in another docker compose, uncomment and set the network name:
    # networks:
    #   - default
    #   - main_project_net

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # 0.0.0.0 so any container (or another server) can connect. If the main project is not docker
      # and is on the same machine, change it to 127.0.0.1 in .env (AI_SERVICE_BIND).
      - "${AI_SERVICE_BIND:-0.0.0.0}:${AI_SERVICE_PORT:-8090}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  ai_storage:

