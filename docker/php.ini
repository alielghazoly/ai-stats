; A request may take up to 5 rounds x 30 seconds in the worst case
max_execution_time = 150
memory_limit = 256M
expose_php = Off

opcache.enable = 1
; 0 in production (faster), 1 in dev so code changes show up immediately (OPCACHE_VALIDATE=1 in .env)
opcache.validate_timestamps = ${OPCACHE_VALIDATE:-0}
